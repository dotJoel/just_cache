name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    # Pinned, not `ubuntu-latest`: this job mounts a tmpfs and asserts filesystem
    # behaviour (cross-device copies, sparseness, mtime/atime), so the image it runs on is
    # part of what the result means. The `ubuntu-latest` label migrates runner images on
    # its own schedule and announces it with a notice on every run; pin the image and move
    # it deliberately instead.
    runs-on: ubuntu-24.04

    steps:
    # `git init` — which checkout runs on a fresh runner — prints ten lines of advice about
    # the initial branch name on every run. Nothing here depends on that name, so set it
    # and stop the output being read as a finding.
    - name: Set the initial branch name
      run: git config --global init.defaultBranch main

    - uses: actions/checkout@v7

    - name: Cache cargo registry and build
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    # A half-resolved merge carries its marker lines as ordinary content, so the file
    # rebases and merges cleanly forever after, and a markdown doc is neither compiled nor
    # tested — nothing else fails on it. A marker that reaches a commit renders in the
    # shipped documentation, so fail here instead.
    - name: Reject committed conflict markers
      run: |
        if git grep -nE '^(<{7}|={7}$|>{7})' -- .; then
          echo "::error::conflict markers committed as text; resolve the file properly, do not commit them"
          exit 1
        fi

    - name: Format
      run: cargo fmt --all -- --check

    - name: Lint
      run: cargo clippy --all-targets -- -D warnings

    - name: Build
      run: cargo build --verbose
    # A cold tier is a different mount, so production always moves files onto it with a
    # copy — `rename` cannot cross a filesystem boundary. The ordinary tests keep source
    # and destination on one filesystem and never reach that code, which is the only
    # path that can leave a partial file behind. Mount a second filesystem here and the
    # cross_device tests exercise it for real; JUST_CACHE_REQUIRE_SECOND_FS makes them
    # fail loudly if this mount ever stops working, instead of skipping silently.
    - name: Mount a second filesystem for cross-device tests
      run: |
        second_fs="$(mktemp -d)"
        sudo mount -t tmpfs -o size=256m tmpfs "$second_fs"
        echo "JUST_CACHE_TEST_SECOND_FS=$second_fs" >> "$GITHUB_ENV"
        echo "JUST_CACHE_REQUIRE_SECOND_FS=1" >> "$GITHUB_ENV"

    - name: Run tests
      run: cargo test --verbose

    - name: Unmount the second filesystem
      if: always()
      run: sudo umount "${JUST_CACHE_TEST_SECOND_FS:-}" || true
