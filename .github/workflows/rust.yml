name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Read-only token: this workflow only builds, lints and tests a checkout, so it
# needs nothing from the API beyond reading the repository. Declaring the floor
# explicitly also caps what a compromised action or dependency could reach.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # sccache wraps rustc and caches each compiled object under a hash of that
  # compilation's inputs, so a build whose `target/` is empty still reuses
  # objects another run already produced. That is exactly the case every new PR
  # branch hits: the cargo cache below is scoped per ref for correctness, so a
  # fresh branch starts cold and recompiles the whole dependency tree. sccache
  # is the cross-branch layer that closes that gap, and it is safe to share —
  # an object only matches when the inputs hash identically, which means it
  # *is* the same compilation, so a hit can never be another ref's stale work.
  RUSTC_WRAPPER: sccache
  # sccache refuses to run alongside incremental compilation: its cache is keyed
  # by a hash of the compile inputs, and an incremental artefact carries state
  # that hash does not describe, so a hit could serve a wrong object. CI has no
  # edit-build loop to accelerate, so turning incremental off costs nothing here.
  CARGO_INCREMENTAL: "0"
  SCCACHE_DIR: /home/runner/.cache/sccache

jobs:
  build:

    # Pinned, not `ubuntu-latest`: this job mounts a tmpfs and asserts filesystem
    # behaviour (cross-device copies, sparseness, mtime/atime), so the image it runs on is
    # part of what the result means. The `ubuntu-latest` label migrates runner images on
    # its own schedule and announces it with a notice on every run; pin the image and move
    # it deliberately instead.
    runs-on: ubuntu-24.04

    steps:
    # `git init` — which checkout runs on a fresh runner — prints ten lines of advice about
    # the initial branch name on every run. Nothing here depends on that name, so set it
    # and stop the output being read as a finding.
    - name: Set the initial branch name
      run: git config --global init.defaultBranch main

    # Full history, not the default depth-1: the code-change detector below diffs against
    # the base SHA, which is not otherwise present on the runner. The repo is small; the
    # depth penalty is negligible next to the correctness of "did this PR touch code?".
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    # sccache and nextest are fetched as single static binaries from their upstream
    # release pages, pinned to an exact version, rather than through a third-party
    # install action. Both are one file, and this keeps the workflow's dependency
    # surface to the two actions already trusted above; the version is the pin.
    # `--proto '=https' --tlsv1.2` refuses a redirect that would downgrade transport.
    - name: Install sccache
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -sSfL --proto '=https' --tlsv1.2 \
          -o /tmp/sccache.tar.gz \
          https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz
        tar -xzf /tmp/sccache.tar.gz -C /tmp
        install -m 0755 /tmp/sccache-v0.18.0-x86_64-unknown-linux-musl/sccache "$HOME/.local/bin/sccache"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install cargo-nextest
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -sSfL --proto '=https' --tlsv1.2 \
          -o /tmp/nextest.tar.gz \
          https://get.nexte.st/0.9.146/linux
        tar -xzf /tmp/nextest.tar.gz -C "$HOME/.local/bin" cargo-nextest
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # The sccache cache is keyed on the lockfile alone and carries a shared
    # restore-key on purpose: its contents are content-addressed, so restoring a
    # sibling ref's objects cannot poison this run the way restoring a `target`
    # cache could. The per-ref cargo cache below still owns `target`.
    - name: Cache sccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /home/runner/.cache/sccache
        key: ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-sccache-

    - name: Cache cargo registry and build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        # Scope the cache to this ref. A shared `restore-keys` prefix let a run
        # restore a sibling/foreign ref's cache, which is both a correctness
        # hazard (stale artefacts from another ref) and a cache-poisoning
        # surface. An exact key per ref keeps hits within the ref that wrote it.
        key: ${{ runner.os }}-cargo-${{ github.ref }}-${{ hashFiles('**/Cargo.lock') }}

    # A half-resolved merge carries its marker lines as ordinary content, so the file
    # rebases and merges cleanly forever after, and a markdown doc is neither compiled nor
    # tested — nothing else fails on it. A marker that reaches a commit renders in the
    # shipped documentation, so fail here instead. This runs even on docs-only changes:
    # it is cheap and docs are exactly where a marker can hide.
    - name: Reject committed conflict markers
      run: |
        if git grep -nE '^(<{7}|={7}$|>{7})' -- .; then
          echo "::error::conflict markers committed as text; resolve the file properly, do not commit them"
          exit 1
        fi

    # Docs-only changes skip the compiler. The branch ruleset requires the `build` check,
    # so this cannot be a trigger-level `paths-ignore` (GitHub leaves a required check
    # "Pending" when the whole workflow is skipped, and the PR cannot merge). Instead the
    # workflow always runs and reports green, and the cargo steps below are gated on
    # whether any changed file lives outside docs/. The skip fires only when we can
    # positively see docs-only changes; anything unknown keeps the full build.
    - name: Detect whether any code changed
      id: code-change
      run: |
        files=""
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags origin "$base" >/dev/null 2>&1 || true
        else
          base="${{ github.event.before }}"
        fi
        if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
          files="$(git diff --name-only "$base"...HEAD 2>/dev/null || true)"
        fi
        skip=true
        if [ -z "$files" ] || printf '%s\n' "$files" | grep -vq '^docs/'; then
          skip=false
        fi
        if [ "$skip" = "true" ]; then
          echo "code_changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "code_changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Format
      if: steps.code-change.outputs.code_changed == 'true'
      run: cargo fmt --all -- --check

    - name: Lint
      if: steps.code-change.outputs.code_changed == 'true'
      run: cargo clippy --all-targets -- -D warnings

    - name: Build
      if: steps.code-change.outputs.code_changed == 'true'
      run: cargo build --verbose
    # A cold tier is a different mount, so production always moves files onto it with a
    # copy — `rename` cannot cross a filesystem boundary. The ordinary tests keep source
    # and destination on one filesystem and never reach that code, which is the only
    # path that can leave a partial file behind. Mount a second filesystem here and the
    # cross_device tests exercise it for real; JUST_CACHE_REQUIRE_SECOND_FS makes them
    # fail loudly if this mount ever stops working, instead of skipping silently.
    # Docs-only changes skip this whole block (see the Detect step above).
    - name: Mount a second filesystem for cross-device tests
      if: steps.code-change.outputs.code_changed == 'true'
      run: |
        second_fs="$(mktemp -d)"
        sudo mount -t tmpfs -o size=256m tmpfs "$second_fs"
        echo "JUST_CACHE_TEST_SECOND_FS=$second_fs" >> "$GITHUB_ENV"
        echo "JUST_CACHE_REQUIRE_SECOND_FS=1" >> "$GITHUB_ENV"

    # nextest compiles and runs the test binaries in parallel, which is most of
    # this job's wall-clock: the same tests `cargo test` runs in ~49s cold finish
    # in ~21s. It reads the same environment as libtest, so the second-filesystem
    # variables set above reach the cross-device tests unchanged.
    - name: Run tests
      if: steps.code-change.outputs.code_changed == 'true'
      run: cargo nextest run

    # nextest deliberately does not run doctests — a limitation, not a skip we
    # chose. Leaving them out would let a doctest that stops compiling pass CI
    # green, which is the "a skip looks exactly like a pass" trap AGENTS.md warns
    # about, so they run in their own step. There are none today; the step keeps
    # that honest by failing the day one is added and broken.
    - name: Run doctests
      if: steps.code-change.outputs.code_changed == 'true'
      run: cargo test --doc

    # The cache hit rate is the whole reason sccache is here; print it even when a
    # step above failed, so a red run still says whether the cache was cold or the
    # work was real.
    - name: Report sccache statistics
      if: always()
      run: sccache --show-stats || true

    - name: Unmount the second filesystem
      if: always()
      run: sudo umount "${JUST_CACHE_TEST_SECOND_FS:-}" || true
