[package]
name = "just_cache"
version = "0.6.0"
edition = "2021"
description = "Move cold, rarely used files onto slower disks, leaving symlinks behind"
license = "MIT"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
filetime = "0.2"
fs4 = "1.1"
globset = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.1"

# The envelope (#140): authenticated encryption for bytes crossing the machine boundary.
# XChaCha20-Poly1305, pure Rust, no `unsafe`; `rand_core` supplies the OS entropy for the
# per-object nonce; `zeroize` clears key material on drop. Consumed by the object-store
# driver (#141) — the first consumer of the envelope.
chacha20poly1305 = "0.11"
# The per-object nonce's randomness: the OS entropy source directly (`getrandom::fill`),
# rather than pulling in `rand` for one 24-byte draw.
getrandom = "0.4"
zeroize = "1"

# The object-store driver (#141): S3-compatible HTTPS with request signing.
# `rustls` provides TLS with no system library dependency (pure Rust); `webpki-roots`
# supplies root certificates for verifying server certificates. The gateway hand-rolls
# `std::net` HTTP because it serves plain HTTP on loopback; an object store requires
# HTTPS, and `std::net` cannot provide TLS without an external implementation — this
# is the minimal addition that makes the driver work, and the dependency stays inside
# `src/object_store.rs`; no other module links it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1.0"
# AWS SigV4 request signing: HMAC-SHA256, SHA256, and hex for the signature.
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
md5 = "0.7"

# The MCP adapter (#137): `just_cache mcp` reads newline-delimited JSON-RPC from an agent.
# Emitting is already hand-rolled everywhere else in this repo — every `--json` writer is a
# `String` built by hand, deliberately, so the output shape is visible in one place with no
# derive in the way. *Parsing* is a different problem: the request bodies are written by the
# client, so a malformed or hostile document reaches the parser, and a hand-rolled reader is
# where a wrong answer becomes a security answer. This dependency is confined to
# `src/mcp.rs` and changes no existing output.
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3"

# The Unix metadata work (ownership, xattrs, SEEK_DATA/SEEK_HOLE) goes through
# rustix rather than raw libc, so the move layer stays free of `unsafe`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

# The FUSE namespace provider (`just_cache mount`, issue #42). `default-features =
# false` drops fuser's `libfuse` feature: the mount then talks to `/dev/fuse`
# directly and only needs the `fusermount3` setuid helper at run time, so a build
# host does not need libfuse headers — CI's `ubuntu-24.04` image has neither. The
# binding is Unix-only; no other subcommand links it, so a sweep/audit on a host
# with no FUSE kernel module still builds and runs.
fuser = { version = "0.18", default-features = false }

# Ctrl-C/SIGTERM handling so `mount` unmounts before it exits. fuser's pure-Rust
# path does not install signal handlers; without this a SIGINT would kill the
# process with the mount still live (an `ENOTCONN` mountpoint the operator has to
# clear by hand), instead of the clean teardown the issue asks for.
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }
