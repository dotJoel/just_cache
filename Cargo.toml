[package]
name = "just_cache"
version = "0.3.0"
edition = "2021"
description = "Move cold, rarely used files onto slower disks, leaving symlinks behind"
license = "MIT"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
filetime = "0.2"
fs4 = "0.13"
globset = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

# The Unix metadata work (ownership, xattrs, SEEK_DATA/SEEK_HOLE) goes through
# rustix rather than raw libc, so the move layer stays free of `unsafe`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }
