[package]
name = "just_cache"
version = "0.3.0"
edition = "2021"
description = "Move cold, rarely used files onto slower disks, leaving symlinks behind"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
fs4 = "0.13"
globset = "0.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
